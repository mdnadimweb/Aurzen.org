services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      INTERNAL_API_URL: http://api:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set a random token of at least 32 characters}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    init: true
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set a random token of at least 32 characters}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique password of at least 16 characters}
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      DATABASE_URL: postgres://aurzen:${POSTGRES_PASSWORD:?Set a random database password (letters and digits only)}@postgres:5432/aurzen
      # Only read by the one-time import from an earlier SQLite deployment.
      DATABASE_PATH: /data/aurzen.sqlite
      COOKIE_SECURE: "true"
      SEED_DEMO: "false"
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - store-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    init: true
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: aurzen
      POSTGRES_USER: aurzen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random database password (letters and digits only)}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurzen -d aurzen"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
volumes:
  store-data:
  postgres-data:
